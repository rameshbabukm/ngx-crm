server:
  port: 8088

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # Mail config - set notification.email.enabled=true and fill smtp details to send real emails
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:noreply@ngxcrm.com}
    password: ${SMTP_PASSWORD:changeme}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

notification:
  email:
    enabled: false         # Set to true + provide SMTP credentials to send real emails
    from: noreply@ngxcrm.com
